version: 2

# Обновления приезжают проверяемыми PR, а не разовым «обновить всё» раз в год.
#
# Отдельно про github-actions: экшены запинены по коммит-SHA (изменяемый тег —
# обещание, которое апстрим может переписать, а tauri-action работает с токеном
# на запись в релизы). Ручной SHA-пин без Dependabot консервирует уязвимость;
# вместе они дают и неизменяемость, и обновляемость — Dependabot двигает SHA
# и правит комментарий с версией.

updates:
  # ── Сами workflow ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # Выдержка перед адаптацией свежего релиза: скомпрометированную версию апстрим
    # обычно отзывает в первые дни (zizmor dependabot-cooldown). Неделя — компромисс
    # между «не тянем яд в первый час» и «не отстаём от секьюрити-патчей».
    cooldown:
      default-days: 7
    groups:
      # Один PR на minor/patch: такие бампы почти всегда безобидны, а пять
      # отдельных PR в неделю читать никто не будет.
      #
      # МАЖОРЫ НАМЕРЕННО ВНЕ ГРУППЫ и приезжают поштучно. Первый же собранный
      # групповой PR подмешал `tauri-action` v0.6.2 → v1.0.0 к рутинному
      # обновлению SHA у codeql-action: смена мажора у экшена, который публикует
      # релизы, пряталась среди косметики. Проверить её CI не может — `release.yml`
      # запускается только по тегу, то есть уже на публикации.
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── npm-зависимости фронтенда ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      # Дробить на отдельные PR имеет смысл только там, где бамп реально может
      # что-то сломать. Экосистемы, которые ходят версиями синхронно, — группой.
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
        update-types: ["minor", "patch"]
      xterm:
        patterns: ["@xterm/*"]
        update-types: ["minor", "patch"]
      fontsource:
        patterns: ["@fontsource/*"]
        update-types: ["minor", "patch"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom"]
        update-types: ["minor", "patch"]
      # Tauri и Svelte остаются поштучно: у них бампы ломающие, и такой PR
      # обязан быть отдельным.

  # ── Rust-зависимости ───────────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
        update-types: ["minor", "patch"]
      # russh — SSH-стек, ядро приложения: бампы смотрим поштучно.
