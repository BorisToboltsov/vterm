name: Фронтенд-окружение
description: >-
  pnpm, Node и зависимости по закоммиченному lockfile — единственное место, где
  workflow их ставят (гейт ci.guard.test.ts).

inputs:
  cache:
    description: >-
      "true" — кэш хранилища pnpm. По умолчанию выключен: публикующий release.yml
      собирается из чистого состояния (кэш — вектор отравления, zizmor
      cache-poisoning), включают его только джобы без публикации.
    default: "false"

runs:
  using: composite
  steps:
    # Тот же мажор, что породил pnpm-lock.yaml и понимает pnpm-workspace.yaml
    # (allowBuilds / minimumReleaseAge). На чужом мажоре `--frozen-lockfile`
    # падает по несовпадению лок-файла — и только в CI.
    - name: pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11

    # Node 22+ обязателен: pnpm 11 требует ≥ 22.13 (тянет `node:sqlite`) и на
    # Node 20 падает уже на `cache: pnpm`, который зовёт `pnpm store path`;
    # SvelteKit 3 — ≥ 22.17 (мажор 22 ставит последний 22.x).
    # Пол держится гейтом ci.guard.test.ts.
    - name: Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Установка зависимостей
      shell: bash
      run: pnpm install --frozen-lockfile
