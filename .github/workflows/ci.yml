name: CI

# Гейты качества на каждом изменении: линтеры, тесты, покрытие, production-сборка
# и supply-chain. Тот же набор, что в Definition of Done (AGENTS.md), но на
# раннерах GitHub — то есть там, где реально собираются публикуемые артефакты.
#
# Этот workflow вызывается ТРИЖДЫ:
#   • push в main и любой pull request — обычный прогон;
#   • release.yml через `workflow_call` — перед сборкой бандлов, чтобы тег
#     физически не мог опубликовать релиз из красного дерева.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Читать исходники — всё, что нужно; на запись прав не выдаём.
permissions:
  contents: read

concurrency:
  # Отменяем устаревшие прогоны только на PR: на main и на теге (release.yml
  # вызывает нас как reusable workflow) обрывать прогон нельзя — за ним идёт
  # публикация.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Фронтенд: типы, тесты с гейтом покрытия, production-сборка ───────────────
  # Одна ОС осознанно: набор чистых `.ts` кроссплатформенных регрессий не ловит —
  # обе раскладки путей проверяются явными кейсами внутри тестов (docs/TESTS.md),
  # а гейты читают исходники, и на CRLF-раннере ловились бы ложные падения.
  web:
    name: Фронтенд (типы, тесты, сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # pnpm, Node и зависимости — общим экшеном (.github/actions/setup-web);
      # кэш хранилища здесь можно: этот workflow ничего не публикует.
      - name: Фронтенд-окружение
        uses: $/.github/actions/setup-web
        with:
          cache: "true"

      - name: Типы (svelte-check)
        run: pnpm check

      # Правила проекта (lint/vterm.js) — инварианты, которые раньше держали
      # текстовые гейты в `pnpm test`; без этого шага их не проверяет никто.
      - name: Линтер (ESLint)
        run: pnpm lint

      # Пороги покрытия (≥ 90 % чистая логика, ≥ 80 % в целом) живут в
      # vitest.config.ts и роняют прогон сами.
      - name: Тесты и покрытие
        run: pnpm test:coverage

      # Отдельный шаг от `check`: тот проверяет только типы, а production-сборку
      # ломает то, что типы пропускают. Без него поломка всплывала впервые
      # внутри `tauri build`, то есть уже во время релиза.
      - name: Production-сборка фронта
        run: pnpm build

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ── Rust: формат, клиппи, юнит-тесты на трёх ОС ─────────────────────────────
  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Тот же образ, на котором собирается Linux-релиз: заодно ловим
          # «собирается на 24.04, но не на 22.04».
          - { os: ubuntu-22.04, name: Linux }
          # Ради этой строки всё и затевалось: код под `#[cfg(windows)]`
          # (drives.rs, proccwd.rs) на Linux-раннере структурно невидим, а
          # windows-раннера под рукой нет. У GitHub раннер бесплатный.
          - { os: windows-latest, name: Windows }
          - { os: macos-latest, name: macOS }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # Rust из rust-toolchain.toml, системные пакеты Tauri на Linux (без них не
      # собирается сам крейт, а значит clippy не доходит до кода) и кэш —
      # общим экшеном (.github/actions/setup-rust).
      - name: Rust-окружение
        uses: $/.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.os }}

      # Формат от ОС не зависит — гоняем один раз, чтобы не платить трижды.
      - name: Формат
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Живые SFTP-тесты помечены #[ignore] и здесь не идут — им нужен sshd,
      # они гоняются в deep.yml.
      - name: Тесты
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Supply chain: уязвимости и политика зависимостей ────────────────────────
  # Отдельная быстрая джоба: cargo-deny читает Cargo.lock и не собирает проект,
  # поэтому системные зависимости Tauri тут не нужны. cargo-audit здесь больше
  # нет: он читает ту же базу RustSec, что `cargo deny check advisories`, но не
  # умеет падать на устаревшем исключении — второй список исключений только
  # расходился с первым.
  deps:
    name: Зависимости (cargo deny, pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # cargo-deny зовёт `cargo metadata` — нужен cargo той же версии, что у сборки.
      - name: Rust-окружение
        uses: $/.github/actions/setup-rust
        with:
          system-deps: "false"

      # Готовый бинарник вместо `cargo install` — секунды против минут.
      - name: cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      # Принятые advisory расписаны с причинами в src-tauri/deny.toml; исключение,
      # которому больше нечего исключать, роняет прогон (`unused-ignored-advisory`).
      # Гейт жёсткий: политика, которую можно «просто посмотреть в логе», не политика.
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny check

      - name: Фронтенд-окружение
        uses: $/.github/actions/setup-web
        with:
          cache: "true"

      # База чистая на момент заведения джобы, поэтому гейт сразу жёсткий.
      # Появится advisory без апстрим-фикса — исключение заводится через
      # `auditConfig.ignoreCves` в pnpm-workspace.yaml, с причиной рядом,
      # как это сделано для Rust в deny.toml. Молча снимать блокировку нельзя.
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
