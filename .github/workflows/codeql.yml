name: CodeQL

# Основной SAST. Родной для GitHub и потому лучше сторонних в трёх вещах:
# правила едут вместе с движком (не тянутся из чужого реестра на каждый прогон),
# находки попадают в Security tab с дедупом и историей, а на PR они видны
# аннотациями прямо в диффе — то есть их читают, а не «есть в логе».
#
# Три языка, и каждый закрывает свою поверхность:
#   javascript-typescript — фронтенд: недоверенный markdown, санитайзер, парсеры
#                           логов, всё, что жуёт вывод чужого хоста;
#   rust                  — бэкенд: SSH/SFTP, работа с файлами, секреты;
#   actions               — сами workflow: инъекции в `run:`, утечки токена.
#
# Набор языков сверен со списком встроенных в запиненную версию экшена
# (src/languages/builtin.json), а не взят по памяти.
#
# Rust — не на PR: базу CodeQL строит полная сборка крейта (самая долгая джоба
# пайплайна), а на PR Rust уже читают clippy, Semgrep (p/rust) и cargo deny.
# Push в main и ежемесячный прогон ловят то, что видит только CodeQL, до тега.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Раз в месяц: база правил CodeQL обновляется независимо от кода, и находка
    # может появиться на неизменившемся файле. Каждый push в main и PR и так
    # сканируются.
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Фронтенд и сами workflow: сборка не нужна ──────────────────────────────
  analyze:
    name: Анализ (${{ matrix.language }})
    runs-on: ubuntu-22.04
    permissions:
      # Заливка результатов в Security tab.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # security-and-quality шире дефолтного набора; шум фильтруется в
          # Security tab, а не тем, что мы не стали смотреть.
          queries: security-and-quality

      - name: Анализ
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # ── Rust: база строится сборкой, поэтому только main и расписание ───────────
  analyze-rust:
    name: Анализ (rust)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # Rust — компилируемый язык: CodeQL строит базу, собирая проект, поэтому
      # ему нужны тот же Rust и те же системные зависимости Tauri, что сборке.
      - name: Rust-окружение
        uses: $/.github/actions/setup-rust
        with:
          cache-key: codeql

      - name: Инициализация CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          queries: security-and-quality

      - name: Сборка базы
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Анализ
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:rust"
