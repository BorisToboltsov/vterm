name: Release

# Собирает vterm под macOS, Windows и Linux на раннерах GitHub и публикует
# готовые файлы в GitHub Release. Запуск — по пушу тега вида v* :
#
#   git tag v0.44.10
#   git push origin v0.44.10
#
# Для публичного репозитория раннеры бесплатны. Сборки НЕ подписаны — при первом
# запуске ОС покажет предупреждение (обход — в docs/INSTALL.md).

on:
  push:
    tags:
      - "v*"

# Права выдаём ПОДЖОБНО, а не на весь workflow: верхний `contents: write` давал
# бы токену на запись даже джобе гейтов, которой хватает чтения (zizmor
# excessive-permissions). По умолчанию — только чтение; write просят те джобы,
# что реально пишут в релиз.
permissions:
  contents: read

jobs:
  # Тег не должен уметь опубликовать релиз из красного дерева. Гоняем ровно тот
  # же набор гейтов, что и на PR (линтеры, тесты, покрытие, production-сборка,
  # supply-chain) — переиспользованием ci.yml, а не копией шагов: копия разошлась
  # бы с оригиналом на первой же правке.
  #
  # Связь `needs: verify` держится гейтом releaseassets.guard.test.ts.
  verify:
    name: Гейты качества
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    # tauri-action создаёт релиз и заливает ассеты — этой джобе нужна запись.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # universal .dmg + .app (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: windows-latest # .msi (WiX) + .exe (NSIS)
            args: ""
          # .deb / .rpm / .AppImage (x86_64) — удалите строку, если Linux не нужен.
          # 22.04 здесь НЕ забытая старая строка, а осознанный выбор: пакеты
          # линкуются с glibc сборочного хоста, поэтому его версия — это пол
          # совместимости артефакта. 22.04 (glibc 2.35) покрывает и Debian 12, и
          # Ubuntu 22.04/24.04+; собери мы на 24.04/26.04 — на старых дистрибутивах
          # артефакт просто не запустится. Для распространяемых бинарников берут
          # самый старый поддерживаемый образ, а не самый свежий. Образ GA, без
          # метки deprecated; `ubuntu-26.04` вдобавок в статусе preview (вне SLA).
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # Системные зависимости Tauri 2 под Linux (WebKitGTK 4.1, tray, rsvg,
      # patchelf для AppImage, rpm для .rpm) — те же, что в GitLab build:linux.
      - name: Системные зависимости Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      # Тот же мажор, что породил pnpm-lock.yaml и понимает pnpm-workspace.yaml
      # (allowBuilds / minimumReleaseAge). На чужом мажоре `--frozen-lockfile`
      # падает по несовпадению лок-файла — и только в CI.
      - name: pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      # Node 22+ обязателен: pnpm 11 требует ≥ 22.13 (тянет `node:sqlite`) и на
      # Node 20 падает. Пол pnpm держится гейтом releaseassets.guard.test.ts.
      # Node 20 на раннерах вдобавок deprecated.
      #
      # БЕЗ `cache: pnpm` — намеренно: это публикующий workflow, а кэш в нём —
      # вектор отравления (cache poisoning): недоверенный PR может записать в
      # кэш-ключ, который потом восстановит релизная сборка (zizmor). Релиз редок
      # и должен собираться из чистого состояния — те байты мы подписываем
      # provenance. Кэш остаётся в ci.yml/nightly.yml, где публикации нет.
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `toolchain` передаётся явно: при пине по SHA имя ссылки больше не
      # выбирает тулчейн (форма @stable работала именно как «ветка stable»),
      # а вход у экшена обязательный.
      - name: Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          # Для universal-сборки macOS нужны обе цели; на других ОС — по умолчанию.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Кэша Rust здесь тоже нет — по той же причине, что и у Node выше.
      - name: Установка JS-зависимостей
        run: pnpm install --frozen-lockfile

      # Собирает фронт (beforeBuildCommand: pnpm build), компилирует Rust в release,
      # упаковывает нативные дистрибутивы и прикрепляет их к релизу тега.
      - name: Сборка и публикация релиза
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "vterm ${{ github.ref_name }}"
          releaseBody: |
            Готовые сборки vterm ${{ github.ref_name }}. Скачайте файл под свою ОС из списка **Assets** ниже.

            - **macOS** — `.dmg`; рядом лежит `open-on-mac.sh` — хелпер запуска неподписанной сборки (снимает карантин Gatekeeper): `chmod +x open-on-mac.sh && ./open-on-mac.sh`.
            - **Windows** — `-setup.exe` (NSIS) / `.msi` (установщики) и `vterm-portable-*-x86_64.exe` — **portable**, один файл без установки (нужен системный WebView2 Runtime).
            - **Linux** — `.deb` / `.rpm` / AppImage (x86_64).

            Сборки не подписаны — при первом запуске ОС может показать предупреждение; как снять, см. [docs/INSTALL.md](https://github.com/BorisToboltsov/vterm/blob/main/docs/INSTALL.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action заливает только то, что произвёл бандлер Tauri. Два файла из
      # GitLab CI (build:macos / build:windows) он не знает — добавляем их в тот же
      # релиз через gh CLI (предустановлен на раннерах; `gh release upload` находит
      # черновик по тегу). `--clobber` — чтобы перезапуск workflow не падал.

      # Хелпер запуска неподписанной сборки должен лежать на странице релиза рядом
      # с .dmg: без него получатель упирается в Gatekeeper («программа повреждена»)
      # и не знает, чем это снять. Локально то же делает scripts/place-opener.sh.
      - name: Хелпер open-on-mac.sh в ассеты релиза (macOS)
        if: matrix.platform == 'macos-latest'
        # Имя тега уезжает через env, а не подстановкой прямо в shell-строку:
        # `${{ … }}` внутри `run:` подставляется ДО запуска шелла, то есть
        # содержимое ссылки становится кодом. Тег создаёт только тот, у кого есть
        # push, но класс уязвимости от этого не меняется — и его ловит zizmor.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" scripts/open-on-mac.sh --clobber

      # Portable-вариант (Фаза 39). Bundle-таргета «portable» у Tauri нет, но сам
      # src-tauri/target/release/vterm.exe уже самодостаточен: фронтенд вшит в
      # бинарь, .msi/.exe — только установочные обёртки вокруг него. Кладём его в
      # релиз под говорящим именем (та же схема, что в GitLab build:windows).
      - name: Portable .exe в ассеты релиза (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/vterm.exe"
          if (-not (Test-Path $exe)) { throw "Не найден $exe — portable-файл собрать не из чего" }
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          $portable = "artifacts/portable/vterm-portable-$v-x86_64.exe"
          Copy-Item $exe $portable
          gh release upload "$env:TAG" $portable --clobber

  # ── Целостность релиза ──────────────────────────────────────────────────────
  # Сборки не подписаны, и страница релиза прямо учит снимать карантин Gatekeeper
  # (open-on-mac.sh). Учить обходить проверку ОС и не давать способа проверить
  # скачанное — несогласованно, поэтому здесь появляется всё, что можно дать
  # бесплатно вместо подписи: контрольные суммы, SLSA-provenance и SBOM.
  #
  # Отдельная джоба после матрицы, а не шаг внутри неё: ассеты приезжают с трёх
  # раннеров, и посчитать сумму по ВСЕМ файлам можно только когда все три легли
  # в релиз.
  integrity:
    name: Целостность (суммы, provenance, SBOM)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # заливка ассетов в релиз
      id-token: write # OIDC-токен для подписи provenance
      attestations: write

    # На уровне джобы, а не шага: `if` шага читает env из workflow/job, но НЕ
    # собственный env этого же шага — условие всегда оказалось бы пустым.
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # Черновик релиза уже содержит всё, что положили три матричные джобы.
      - name: Забрать ассеты релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*'
          ls -la dist

      # Суммы считаются по именам файлов без пути, чтобы `sha256sum -c` работал
      # из каталога загрузок получателя.
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      # Единственный бесплатный механизм подтверждения происхождения, доступный
      # неподписанному приложению. Gatekeeper и SmartScreen он не заменяет: те
      # проверяют подпись разработчика, а provenance отвечает на другой вопрос —
      # «этот ли репозиторий и этот ли workflow произвели именно эти байты».
      # Проверяется получателем: gh attestation verify <файл> --repo <owner/repo>
      - name: SLSA-provenance на бандлы
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      # Один инструмент на обе экосистемы: syft читает и Cargo.lock, и
      # pnpm-lock.yaml. Аудитория vterm — админы и SRE, у которых свои требования
      # к составу поставки; SBOM позволяет им прогнать проверку самим, не веря
      # нам на слово.
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: vterm-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM в ассеты релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" vterm-sbom.cdx.json --clobber

      # Задача обратная той, что кажется: мы не ищем вирус в бинаре, который сами
      # только что скомпилировали. Неподписанный portable .exe — классический
      # кандидат в ЛОЖНЫЕ срабатывания SmartScreen и эвристик, и знать об этом
      # надо раньше пользователя, который иначе придёт с «ваш терминал — троян».
      #
      # Шаг опционален: загрузка ассетов третьей стороне включается только тем,
      # что владелец репозитория завёл секрет VT_API_KEY. Нет ключа — шаг молча
      # пропускается, наружу ничего не уходит. См. SECURITY.md.
      - name: VirusTotal (детектор ложных срабатываний)
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.AppImage
