name: Release

# Собирает vterm под macOS, Windows и Linux на раннерах GitHub и публикует
# готовые файлы в GitHub Release. Запуск — по пушу тега вида v* :
#
#   git tag v0.44.10
#   git push origin v0.44.10
#
# Для публичного репозитория раннеры бесплатны. Сборки НЕ подписаны — при первом
# запуске ОС покажет предупреждение (обход — в docs/INSTALL.md).

on:
  push:
    tags:
      - "v*"

# tauri-action создаёт релиз и заливает в него ассеты — нужен доступ на запись.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # universal .dmg + .app (Intel + Apple Silicon)
            args: "--target universal-apple-darwin"
          - platform: windows-latest # .msi (WiX) + .exe (NSIS)
            args: ""
          - platform: ubuntu-22.04 # .deb / .rpm / .AppImage (x86_64) — удалите строку, если Linux не нужен
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Системные зависимости Tauri 2 под Linux (WebKitGTK 4.1, tray, rsvg,
      # patchelf для AppImage, rpm для .rpm) — те же, что в GitLab build:linux.
      - name: Системные зависимости Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Для universal-сборки macOS нужны обе цели; на других ОС — по умолчанию.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Кэш Rust (ускоряет повторные сборки)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установка JS-зависимостей
        run: pnpm install --frozen-lockfile

      # Собирает фронт (beforeBuildCommand: pnpm build), компилирует Rust в release,
      # упаковывает нативные дистрибутивы и прикрепляет их к релизу тега.
      - name: Сборка и публикация релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "vterm ${{ github.ref_name }}"
          releaseBody: |
            Готовые сборки vterm ${{ github.ref_name }}. Скачайте файл под свою ОС из списка **Assets** ниже.

            - **macOS** — `.dmg`; рядом лежит `open-on-mac.sh` — хелпер запуска неподписанной сборки (снимает карантин Gatekeeper): `chmod +x open-on-mac.sh && ./open-on-mac.sh`.
            - **Windows** — `-setup.exe` (NSIS) / `.msi` (установщики) и `vterm-portable-*-x86_64.exe` — **portable**, один файл без установки (нужен системный WebView2 Runtime).
            - **Linux** — `.deb` / `.rpm` / AppImage (x86_64).

            Сборки не подписаны — при первом запуске ОС может показать предупреждение; как снять, см. [docs/INSTALL.md](https://github.com/BorisToboltsov/vterm/blob/main/docs/INSTALL.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action заливает только то, что произвёл бандлер Tauri. Два файла из
      # GitLab CI (build:macos / build:windows) он не знает — добавляем их в тот же
      # релиз через gh CLI (предустановлен на раннерах; `gh release upload` находит
      # черновик по тегу). `--clobber` — чтобы перезапуск workflow не падал.

      # Хелпер запуска неподписанной сборки должен лежать на странице релиза рядом
      # с .dmg: без него получатель упирается в Gatekeeper («программа повреждена»)
      # и не знает, чем это снять. Локально то же делает scripts/place-opener.sh.
      - name: Хелпер open-on-mac.sh в ассеты релиза (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" scripts/open-on-mac.sh --clobber

      # Portable-вариант (Фаза 39). Bundle-таргета «portable» у Tauri нет, но сам
      # src-tauri/target/release/vterm.exe уже самодостаточен: фронтенд вшит в
      # бинарь, .msi/.exe — только установочные обёртки вокруг него. Кладём его в
      # релиз под говорящим именем (та же схема, что в GitLab build:windows).
      - name: Portable .exe в ассеты релиза (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/vterm.exe"
          if (-not (Test-Path $exe)) { throw "Не найден $exe — portable-файл собрать не из чего" }
          New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
          $portable = "artifacts/portable/vterm-portable-$v-x86_64.exe"
          Copy-Item $exe $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber
