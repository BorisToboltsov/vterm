name: Security scan

# Сканеры второго эшелона. Разделение с ci.yml намеренное:
#
#   ci.yml (deps)  — ЖЁСТКИЕ гейты: cargo deny / pnpm audit.
#                    Политика с расписанными исключениями (deny.toml) — она
#                    обязана ронять прогон, иначе это не политика.
#   здесь          — СОВЕТУЮЩИЕ: Semgrep, Trivy, zizmor. Их находки едут в
#                    Security tab SARIF-ом и разбираются там, а не роняют
#                    чужой PR на правиле из внешнего реестра.
#
# У каждой заботы один сканер (гейт ci.guard.test.ts): уязвимости зависимостей —
# cargo deny и pnpm audit, секреты и конфиги — Trivy, анти-паттерны кода —
# Semgrep, поток данных — CodeQL, сами workflow — zizmor и CodeQL `actions`.
# Второй сканер той же заботы давал вторую копию находки и второй список
# исключений, который расходился с первым.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Semgrep: анти-паттерны во фронтенде и бэкенде ───────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      - name: Установка semgrep
        run: pipx install semgrep

      # Правила тянутся из реестра — это сетевой вызов, и он иногда флейкает.
      # Флейк не должен ронять чужой PR, поэтому шаг продолжается при ошибке;
      # результат при этом всё равно уезжает в витрину шагом ниже.
      #
      # `unsafe-usage` снят: он помечает каждый `unsafe`, с обоснованием или без, а
      # `unsafe` проверяет clippy (`undocumented_unsafe_blocks` в Cargo.toml — у
      # каждого блока `// SAFETY:`), снятие держит гейт ci.guard. Находки остальных
      # правил p/rust разбираются на месте: строка `// nosemgrep: <правило>` перед
      # находкой и причина комментарием над ней — после `nosemgrep:` Semgrep читает
      # список правил, и причина в той же строке стала бы ещё одним «правилом».
      - name: Скан
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/typescript --config p/javascript --config p/rust \
            --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage \
            --sarif --output semgrep.sarif \
            src/ src-tauri/src/

      - name: Результаты в Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ── Trivy: секреты и misconfig по дереву репозитория ───────────────────────
  # Без `vuln`: уязвимости зависимостей читаются из тех же lockfile, что у
  # cargo deny и pnpm audit, — только без их политики исключений.
  trivy:
    name: Trivy (fs)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      - name: Скан
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret,misconfig
          format: sarif
          output: trivy.sarif
          # Accepted findings, each scoped to one path with its reason.
          trivyignores: .trivyignore.yaml

      - name: Результаты в Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ── zizmor: линтер самих workflow ──────────────────────────────────────────
  # Ловит то, чего не видит ни один из сканеров кода: подстановку `${{ … }}`
  # прямо в `run:` (значение становится кодом до запуска шелла), незапиненные
  # экшены, лишние права токена. Первую находку этого класса — интерполяцию
  # github.ref_name в `gh release upload` — мы уже вычистили руками; джоба
  # держит, чтобы она не вернулась.
  zizmor:
    name: zizmor (workflows)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять GITHUB_TOKEN в .git/config: ни один шаг не пушит через git
          # (релизы идут через API tauri-action / gh), поэтому креды не нужны (zizmor artipacked).
          persist-credentials: false

      # Отдельного шага выгрузки здесь НЕТ, и это не пропуск: при
      # `advanced-security: true` (дефолт) экшен заливает SARIF в Security tab
      # сам. Вторая загрузка той же пары tool/category в одной джобе отвергается
      # с «only one run of the codeql/analyze or codeql/upload-sarif actions is
      # allowed per job per tool/category» — на чём эта джоба и падала.
      - name: Аудит
        continue-on-error: true
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Разбираем и workflow, и композитные экшены, если появятся.
          collect: all
          advanced-security: true
