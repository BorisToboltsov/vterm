<svg xmlns="http://www.w3.org/2000/svg" width="960" height="276" viewBox="0 0 960 276" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Путь изменения от ветки до релиза</title>
<desc id="d">Ветка, PR, main, тег, черновик, релиз. Останавливают CI перед main и гейты релиза перед черновиком; от main до тега — поезд по понедельникам или хотфикс вручную; публикует человек. Сканеры не останавливают; раз в месяц проверки идут сами.</desc>
<style>
:root{--bg:#ffffff;--panel:#f5f7fb;--panel2:#eaeff7;--edge:#d5dde9;--text:#1b2433;--muted:#5a667b;--blue:#2f6fdb;--green:#17845a;--amber:#a56c00;--red:#c43d49;--violet:#7a4fd0;--blue-t:#2f6fdb1a;--green-t:#17845a1a;--amber-t:#a56c001a;--violet-t:#7a4fd01a;}
@media (prefers-color-scheme: dark){:root{--bg:#0b0f18;--panel:#131a28;--panel2:#1a2334;--edge:#2a3850;--text:#dbe3f0;--muted:#94a2b8;--blue:#7db3ff;--green:#5fd39a;--amber:#e6b866;--red:#f2707a;--violet:#b79cff;--blue-t:#7db3ff1f;--green-t:#5fd39a1f;--amber-t:#e6b8661f;--violet-t:#b79cff1f;}}
</style>
<rect x="0.5" y="0.5" width="959" height="275" rx="14" fill="var(--bg)" stroke="var(--edge)" stroke-width="1"/>
<line x1="62" y1="104" x2="392" y2="104" stroke="var(--blue)" stroke-width="7" stroke-linecap="round"/><line x1="392" y1="104" x2="556" y2="104" stroke="var(--muted)" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/><line x1="556" y1="104" x2="898" y2="104" stroke="var(--green)" stroke-width="7" stroke-linecap="round"/><polygon points="317.71,110.51 308.51,119.71 295.49,119.71 286.29,110.51 286.29,97.49 295.49,88.29 308.51,88.29 317.71,97.49" fill="var(--red)"/><rect x="294" y="101.5" width="16" height="5" rx="1.5" fill="var(--bg)"/><text x="302" y="48" font-size="14" font-weight="700" fill="var(--red)" text-anchor="middle">CI</text><text x="302" y="66" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">5 обязательных проверок</text><polygon points="669.71,110.51 660.51,119.71 647.49,119.71 638.29,110.51 638.29,97.49 647.49,88.29 660.51,88.29 669.71,97.49" fill="var(--red)"/><rect x="646" y="101.5" width="16" height="5" rx="1.5" fill="var(--bg)"/><text x="654" y="48" font-size="14" font-weight="700" fill="var(--red)" text-anchor="middle">Гейты релиза</text><text x="654" y="66" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">CI, глубокие, сборка</text><text x="474" y="48" font-size="14" font-weight="700" fill="var(--green)" text-anchor="middle">Поезд</text><text x="474" y="66" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">по понедельникам</text><text x="474" y="92" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">хотфикс — вручную</text><circle cx="825" cy="104" r="17" fill="var(--green)"/><circle cx="825" cy="99" r="5" fill="var(--bg)"/><path d="M816 114 a9 8 0 0 1 18 0 z" fill="var(--bg)"/><text x="825" y="48" font-size="14" font-weight="700" fill="var(--green)" text-anchor="middle">Человек</text><text x="825" y="66" font-size="12" font-weight="400" fill="var(--muted)" text-anchor="middle">публикует</text><circle cx="62" cy="104" r="10" fill="var(--bg)" stroke="var(--blue)" stroke-width="4"/><text x="62" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">Ветка</text><circle cx="212" cy="104" r="10" fill="var(--bg)" stroke="var(--blue)" stroke-width="4"/><text x="212" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">PR</text><circle cx="392" cy="104" r="10" fill="var(--bg)" stroke="var(--blue)" stroke-width="4"/><text x="392" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">main</text><circle cx="556" cy="104" r="10" fill="var(--bg)" stroke="var(--green)" stroke-width="4"/><text x="556" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">Тег v*</text><circle cx="752" cy="104" r="10" fill="var(--bg)" stroke="var(--green)" stroke-width="4"/><text x="752" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">Черновик</text><circle cx="898" cy="104" r="10" fill="var(--bg)" stroke="var(--green)" stroke-width="4"/><text x="898" y="138" font-size="14.5" font-weight="650" fill="var(--text)" text-anchor="middle">Релиз</text><rect x="178" y="162" width="248" height="40" rx="9" fill="var(--amber-t)" stroke="none" stroke-width="1"/><text x="302" y="187" font-size="13" font-weight="600" fill="var(--amber)" text-anchor="middle">Сканеры смотрят, но не держат</text><rect x="28" y="216" width="904" height="40" rx="9" fill="var(--violet-t)" stroke="none" stroke-width="1"/><text x="480" y="241" font-size="13" font-weight="600" fill="var(--violet)" text-anchor="middle">1-го числа, без всяких изменений: глубокие проверки и сканеры ловят дрейф окружения</text>
</svg>
