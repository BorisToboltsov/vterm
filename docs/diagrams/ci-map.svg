<title id="t">Карта пайплайнов vterm</title>
<desc id="d">Что запускает каждый workflow и чем он кончается. CI (ci.yml): web, rust, deps; Security scan (security.yml): semgrep, trivy, zizmor; CodeQL (codeql.yml): analyze, analyze-rust; Глубокие проверки (deep.yml): fuzz, live-sftp, e2e; Плановый выпуск (train.yml): plan, cut, check, push-tag; Release (release.yml): tag, verify, deep, release, integrity.</desc>
