allowBuilds:
  esbuild: true

overrides:
  # Security: force a patched `nanoid` (>= 3.3.17). The < 3.3.17 infinite-loop DoS
  # (CVE-2026-67213 / GHSA-2v37-7h3g-55p8) only triggers with an attacker-controlled
  # `size`, which vterm never passes; nanoid is a build-time transitive dep via
  # postcss (vite), not shipped in the app. Pin to `^3.3.17` (3.3.x), NOT `>=3.3.17`
  # — nanoid 5.x is ESM-only and would break postcss's CommonJS require. 3.3.x is
  # both patched and API-compatible.
  nanoid: "^3.3.17"
  # Security: force a patched `source-map-js` (>= 1.2.2). The < 1.2.2 event-loop
  # DoS (GHSA-68fv-2mgg-jv7q) is triggered by a crafted indexed source map; it is a
  # build- and test-time transitive dep (postcss via vite, @tailwindcss/node,
  # css-tree via jsdom, magicast via the coverage provider), not shipped in the
  # app. Every dependent declares a `^1.2.x` range, so `^1.2.2` only raises the
  # floor — no API change.
  source-map-js: "^1.2.2"

auditConfig:
  ignoreGhsas:
    # minimatch < 11.0.1 (CVE-2026-118764 / GHSA-g3hv-75wg-m249): DoS через размножение частей
    # glob-шаблона. У нас minimatch — только сборочная зависимость линтера (eslint,
    # typescript-eslint) на шаблонах из нашего eslint.config.js: чужой шаблон туда не попадает,
    # в приложение он не входит. Исправлен только в minimatch 11, где убраны `makeRe()`,
    # `Minimatch#regexp` и `AST`, а eslint 10.14 и typescript-eslint требуют `^10` — override
    # на мажор сломал бы линтер. Снять, когда eslint перейдёт на minimatch 11.
    - GHSA-g3hv-75wg-m249
