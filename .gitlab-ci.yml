# CI для vterm — собирает ТРИ дистрибутива (macOS + Windows + Linux) на каждом изменении.
# Один кросс-ОС файл невозможен, а кросс-компиляция Tauri между ОС нерабочая,
# поэтому используются три self-hosted раннера: macOS, Windows и Linux
# (последний собирает .deb + .rpm + AppImage под x86_64).
#
# ⚠️ ТЕГИ РАННЕРОВ — ПЛЕЙСХОЛДЕРЫ. Замените `macos` / `windows` / `linux` ниже
# на теги ваших зарегистрированных раннеров (GitLab → Settings → CI/CD → Runners).
# Установка Rust/pnpm сделана идемпотентной — на постоянных раннерах повторно
# ничего не переустанавливается.

stages:
  - lint
  - security
  - test
  - build
  - release

# Запускаем пайплайн на: дефолтной ветке, merge request'ах, тегах и вручную.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# ════════════════════════════════════════════════════════════════════════════
#  Phase 5 — тесты и покрытие (safety net перед рефакторингом).
#  Стадии: lint → test (rust + web + e2e) → build → release.
#  Подробности и как запускать локально — см. docs/TESTS.md.
# ════════════════════════════════════════════════════════════════════════════

# ── Линтеры/форматтеры как гейты ───────────────────────────────────────────────
lint:
  stage: lint
  tags: [linux]                     # ← замените на тег вашего Linux-раннера
  cache:
    key: cargo-linux
    paths:
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - rustup component add rustfmt clippy
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    - cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
    - pnpm check

# ── Windows-only clippy (cfg-зависимый код) ───────────────────────────────────
# Джоба lint выше идёт на Linux, то есть под cfg(unix): код внутри #[cfg(windows)]
# и мёртвые под Windows привязки (v0.38.2) она структурно не видит. Кросс-проверка
# с Linux (`--target x86_64-pc-windows-msvc`) НЕ работает: aws-lc-sys (через rustls)
# компилирует C и требует windows.h из Windows SDK — падает на этапе сборки
# зависимостей, до клиппи. Поэтому проверка идёт нативно на windows-раннере.
# Пока раннера с тегом windows нет — джоба ручная и не роняет пайплайн (как
# build:windows). Локально на Windows-машине: та же команда в PowerShell.
lint:windows:
  stage: lint
  tags: [windows]                   # ← замените на тег вашего Windows-раннера
  rules:
    - when: manual
  allow_failure: true
  cache:
    key: cargo-windows-lint          # свой ключ: build:windows кэширует release+pnpm-store
    paths:
      - src-tauri/target/
  before_script:
    - if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { choco install rustup.install -y --no-progress }
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - rustup default stable
    - rustup component add clippy
  script:
    - cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

# ════════════════════════════════════════════════════════════════════════════
#  Phase 6.1 — security gates (SAST / supply-chain). Accepted advisories and
#  rationale live in src-tauri/deny.toml + .cargo/audit.toml; see SECURITY.md.
# ════════════════════════════════════════════════════════════════════════════

# ── Rust supply chain: RUSTSEC advisories + licenses/bans/sources ──────────────
security:rust:
  stage: security
  tags: [linux]
  cache:
    key: cargo-linux
    paths:
      - src-tauri/target/
  before_script:
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit
    - command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny
  script:
    - cd src-tauri
    - cargo audit          # honours .cargo/audit.toml ignores
    - cargo deny check     # advisories + licenses + bans + sources (deny.toml)

# ── JS supply chain + Semgrep SAST ─────────────────────────────────────────────
security:web:
  stage: security
  image: returntocorp/semgrep:latest   # bundles semgrep; any image with pnpm also works
  tags: [linux]
  before_script:
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm install --frozen-lockfile
  script:
    - pnpm audit --audit-level moderate
    - semgrep --config p/typescript --config p/javascript --config p/secrets --error src/
  allow_failure: true   # Semgrep registry needs network; don't hard-block MRs on it

# ── Bundle/filesystem scan (vulns + secrets + IaC misconfig) ───────────────────
security:bundle:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags: [linux]
  script:
    - trivy fs --scanners vuln,secret,misconfig --exit-code 0 --no-progress .
  allow_failure: true   # informational; tighten exit-code once the baseline is clean

# ── Rust: юнит-тесты + покрытие (чистая логика ≥ 90%) ──────────────────────────
test:rust:
  stage: test
  tags: [linux]
  cache:
    key: cargo-linux
    paths:
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - command -v cargo-llvm-cov >/dev/null 2>&1 || cargo install cargo-llvm-cov
    - rustup component add llvm-tools-preview
  script:
    # Run the tests once, then emit both a text summary (for the coverage badge)
    # and a Cobertura report (for the MR widget) from the collected data.
    - cargo llvm-cov --manifest-path src-tauri/Cargo.toml --no-report
    - cargo llvm-cov report --manifest-path src-tauri/Cargo.toml
    - cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --cobertura --output-path coverage-rust.xml
  coverage: '/TOTAL.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-rust.xml

# ── Фронтенд: Vitest юнит/компонентные тесты + покрытие (гейт в vitest.config) ──
test:web:
  stage: test
  tags: [linux]
  cache:
    key: cargo-linux
    paths:
      - .pnpm-store/
  before_script:
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile
  script:
    # Coverage thresholds (90% pure logic / 80% overall) are enforced inside
    # vitest.config.ts — the job fails if they are not met.
    - pnpm test:coverage --reporter=default --reporter=junit --outputFile=junit-web.xml
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: junit-web.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# ── E2E: реальное окно через tauri-driver против тестового SSH-сервера ──────────
#   tauri-driver работает на Linux/Windows (не на macOS). Запускается вручную или
#   на дефолтной ветке, чтобы не задерживать каждый MR (сборка релиза долгая).
test:e2e:
  stage: test
  tags: [linux]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  services:
    - name: lscr.io/linuxserver/openssh-server:latest
      alias: ssh
  variables:
    PASSWORD_ACCESS: "true"
    USER_NAME: tester
    USER_PASSWORD: testpass
    VTERM_TEST_SSH_HOST: ssh
    VTERM_TEST_SSH_PORT: "2222"
    VTERM_TEST_SSH_USER: tester
    VTERM_TEST_SSH_PASS: testpass
  before_script:
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    # System deps for the Tauri Linux build + WebKitWebDriver for tauri-driver.
    - command -v tauri-driver >/dev/null 2>&1 || cargo install tauri-driver
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm install --frozen-lockfile
    - (cd e2e && pnpm install)
  script:
    - cd e2e && pnpm test:e2e
  allow_failure: true   # native E2E is environment-sensitive; don't block on flakes

# ── macOS: .app + .dmg (universal: Intel + Apple Silicon) ──────────────────────
build:macos:
  stage: build
  tags: [macos]                     # ← замените на тег вашего macOS-раннера
  # Пока нет macOS-раннера — задача ручная и не роняет/не блокирует пайплайн.
  # Когда зарегистрируете раннер с тегом macos, запускайте её кнопкой (или
  # уберите этот блок rules, чтобы снова собирать автоматически).
  rules:
    - when: manual
  allow_failure: true
  cache:
    key: cargo-macos
    paths:
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-apple-darwin x86_64-apple-darwin
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build --target universal-apple-darwin
    # Кладём хелпер запуска неподписанной сборки рядом с .dmg (снимает карантин
    # Gatekeeper на чужом Mac) — попадает в тот же артефакт, что и бандл.
    - bash scripts/place-opener.sh
  artifacts:
    name: vterm-macos
    paths:
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - src-tauri/target/universal-apple-darwin/release/bundle/dmg/open-on-mac.sh
      - src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
    expire_in: 2 weeks

# ── Windows: .msi + NSIS .exe (PowerShell-раннер) ──────────────────────────────
build:windows:
  stage: build
  tags: [windows]                   # ← замените на тег вашего Windows-раннера
  # Пока нет Windows-раннера — задача ручная и не роняет/не блокирует пайплайн.
  # Когда зарегистрируете раннер с тегом windows, запускайте её кнопкой (или
  # уберите этот блок rules, чтобы снова собирать автоматически).
  rules:
    - when: manual
  allow_failure: true
  cache:
    key: cargo-windows
    paths:
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    # Требуются предустановленные VS C++ Build Tools и WebView2 Runtime.
    - if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { choco install rustup.install -y --no-progress }
    - $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
    - rustup default stable
    - if (-not (Get-Command pnpm -ErrorAction SilentlyContinue)) { npm install -g pnpm }
    - pnpm config set store-dir "$env:CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build
    # Portable-вариант (Фаза 39). Tauri не умеет таргет "portable", но сам
    # `vterm.exe` из target/release уже самодостаточен: фронтенд вшит в бинарь,
    # .msi/.exe — только установочные обёртки вокруг него. Поэтому просто кладём
    # его рядом с инсталляторами под говорящим именем.
    #   • Требуется системный WebView2 Runtime (есть по умолчанию в Win11 и
    #     Win10 21H2+); на более старых системах нужен инсталлятор.
    #   • «Portable» здесь про один файл, а не про переносимое состояние:
    #     профили/настройки по-прежнему живут в %APPDATA%\vterm.
    - $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
    - New-Item -ItemType Directory -Force -Path artifacts/portable | Out-Null
    - Copy-Item src-tauri/target/release/vterm.exe "artifacts/portable/vterm-portable-$v-x86_64.exe"
  artifacts:
    name: vterm-windows
    paths:
      - src-tauri/target/release/bundle/msi/*.msi
      - src-tauri/target/release/bundle/nsis/*.exe
      - artifacts/portable/*.exe
    expire_in: 2 weeks

# ── Linux: .deb + .rpm + AppImage (x86_64) ─────────────────────────────────────
# Docker-образ node:20-bookworm даёт свежий Node/npm; WebKitGTK и упаковщики
# (rpm, patchelf для AppImage) ставим через apt. targets:"all" в tauri.conf.json
# на Linux разворачивается в deb+rpm+appimage, поэтому отдельно таргеты не задаём.
# arm64-пакеты пока не собираем (нужен arm64-раннер) — приоритет x86_64.
build:linux:
  stage: build
  image: node:20-bookworm
  tags: [linux]                     # ← замените на тег вашего Linux-раннера
  # Пока нет выделенного build-раннера — задача ручная и не роняет пайплайн.
  # Когда будет раннер, запускайте кнопкой (или уберите rules для авто-сборки).
  rules:
    - when: manual
  allow_failure: true
  cache:
    key: cargo-linux
    paths:
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    # Системные зависимости Tauri 2 под Linux: WebKitGTK 4.1, GTK/ayatana-tray,
    # librsvg (иконки), patchelf (AppImage), rpm (сборка .rpm).
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
        libayatana-appindicator3-dev librsvg2-dev patchelf rpm
    - command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build
  artifacts:
    name: vterm-linux
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
      - src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 2 weeks

# ── Релиз: создаётся при пуше тега вида v* ─────────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [linux]                     # ← любой Linux-раннер (для release-cli)
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - build:macos
    - build:windows
    - build:linux
  script:
    - echo "Публикуем релиз $CI_COMMIT_TAG (артефакты доступны в пайплайне)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "vterm $CI_COMMIT_TAG"
    description: "Автоматический релиз vterm $CI_COMMIT_TAG (macOS + Windows + Linux)."
