# Disposable keyboard-interactive-only sshd (see e2e/kbdint/Dockerfile).
#
#   docker compose -f e2e/docker-compose.kbdint.yml up -d --build
#   cargo test --manifest-path src-tauri/Cargo.toml --lib live_kbdint -- --ignored
#   docker compose -f e2e/docker-compose.kbdint.yml down
#
# Scratch codes are single-use: `down` + `up` before running the suite again.

services:
  kbdint:
    build: ./kbdint
    container_name: vterm-test-kbdint
    ports:
      - "2223:2222"
