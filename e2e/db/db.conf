Port 2222
PasswordAuthentication yes
PermitRootLogin no
# The password is public: forward to the stand's databases and nowhere else.
# PermitOpen judges a socket too: its path stands as a host, in brackets.
AllowTcpForwarding local
AllowStreamLocalForwarding local
PermitOpen postgres:5432 mysql:3306 mariadb:3306 [/var/run/postgresql/.s.PGSQL.5432]:*
PermitListen none
GatewayPorts no
PermitTunnel no
AllowAgentForwarding no
X11Forwarding no
