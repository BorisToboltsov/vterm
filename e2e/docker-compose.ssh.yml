# Disposable SSH/SFTP server for integration & E2E tests.
# Brings up linuxserver/openssh-server with password auth enabled.
#
#   docker compose -f e2e/docker-compose.ssh.yml up -d
#   # ... run tests against 127.0.0.1:2222 (tester / testpass) ...
#   docker compose -f e2e/docker-compose.ssh.yml down
#
# In CI this is provided as a service instead (see .gitlab-ci.yml, e2e job).

services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vterm-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=tester
      - USER_PASSWORD=testpass
      - SUDO_ACCESS=false
    ports:
      - "2222:2222"
    restart: unless-stopped
