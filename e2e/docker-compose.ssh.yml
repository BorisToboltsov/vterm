# Disposable SSH/SFTP server for integration & E2E tests.
# Brings up linuxserver/openssh-server with password auth enabled.
#
#   docker compose -f e2e/docker-compose.ssh.yml up -d
#   # ... run tests against 127.0.0.1:2222 (tester / testpass) ...
#   docker compose -f e2e/docker-compose.ssh.yml down
#
# CI brings it up with the same command (.github/actions/test-sshd, used by deep.yml).
# The password is in this file, so the port is on 127.0.0.1 alone (gate:
# stands.guard) and sshd forwards nothing.

services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vterm-test-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=tester
      - USER_PASSWORD=testpass
      - SUDO_ACCESS=false
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      # Read-only, so the image's chown leaves the checkout's file alone (it
      # says so in the log). Without the file `up` fails: by default Compose
      # would mount an empty directory, and forwarding would be back.
      - type: bind
        source: ./ssh/noforward.conf
        target: /config/sshd/sshd_config.d/noforward.conf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
