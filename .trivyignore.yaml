# Accepted Trivy findings, each scoped to the one file it's about and explained.
# Passed to the scan explicitly (security.yml `trivyignores`); an ID without
# `paths` would silence it for every future Dockerfile too.
misconfigurations:
  - id: DS-0002
    paths:
      - e2e/kbdint/Dockerfile
    statement: >-
      Test-only sshd for the live keyboard-interactive tests. sshd has to run as
      root to switch to the user logging in; the container is local and
      short-lived (docker compose up … down around the test run).
  - id: DS-0002
    paths:
      - e2e/sudo/Dockerfile
    statement: >-
      Test-only sshd for the live su and sudo tests. sshd has to run as root to
      switch to the user logging in; the container is local and short-lived
      (docker compose up … down around the test run).
  - id: DS-0026
    paths:
      - e2e/linux/Dockerfile
    statement: >-
      The Linux box of scripts/linux-box.sh runs one command — a build or the
      E2E suite — and exits with its status. It serves nothing and has no
      state of health to probe; a HEALTHCHECK would have nothing to ask.
  - id: KSV-0110
    paths:
      - e2e/k8s/stand.yaml
    statement: >-
      The k8s stand of the live tests has no namespace on purpose: it is applied
      with `kubectl apply -n` into a namespace of its own — `vterm-stand` by hand,
      `vterm-live-<pid>` by live_kube, which deletes it after the run. A namespace
      written in the file would make it refuse any other. Every other KSV rule
      holds: non-root, read-only root filesystem, no capabilities, seccomp
      RuntimeDefault, requests and limits.
secrets:
  - id: aws-access-key-id
    paths:
      - src/lib/ai/redact.cases.json
    statement: >-
      Not a secret: src/lib/ai/redact.cases.json holds the shared examples the
      secret mask is held to on both sides — redactSecrets in the frontend and
      the diagnostics writer's mask (src-tauri/src/diag/mask.rs, ADR 0063). Each
      input is a made-up value shaped like a real token, so the mask is shown
      catching that shape; a value nobody issued cannot leak.
  - id: slack-access-token
    paths:
