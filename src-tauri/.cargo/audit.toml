# cargo-audit config (mirror of deny.toml's advisory ignores so `cargo audit`
# and `cargo deny` agree). Rationale for each id is documented in deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa Marvin attack — no fix; prefer ed25519 keys
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (transitive)
  "RUSTSEC-2024-0411", # gtk-rs GTK3 bindings (Linux webview stack)
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429", # glib unsoundness (Linux GTK stack)
  "RUSTSEC-2025-0075", # unic-* unmaintained (transitive)
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
