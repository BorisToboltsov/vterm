# cargo-audit config (mirror of deny.toml's advisory ignores so `cargo audit`
# and `cargo deny` agree). Rationale for each id is documented in deny.toml.
# cargo-audit does not flag a stale ignore — cargo-deny does
# (`unused-ignored-advisory`), so this list equals deny.toml's (gate:
# tauri-security.guard.test.ts). The glib `unsound` advisory (RUSTSEC-2024-0429)
# is reported by both tools as a warning and fails neither, so neither ignores it.
[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa Marvin attack — no fix; prefer ed25519 keys
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained (gtk-rs 0.18, Linux webview stack)
  "RUSTSEC-2026-0370", # zvariant unmaintained — merged into zbus 6 (Linux D-Bus)
  "RUSTSEC-2026-0371", # zbus_names, same
  "RUSTSEC-2026-0372", # zvariant_derive, same
]
