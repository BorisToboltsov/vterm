# cargo-deny policy for vterm — supply-chain gate.
#   cargo deny check            (all)
#   cargo deny check advisories (RUSTSEC)
#
# Every ignored advisory is documented with rationale and must be revisited
# periodically (especially RUSTSEC-2023-0071 once `rsa` ships a fix).

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ── Accepted vulnerability (no upstream fix available) ──────────────────────
  # rsa — "Marvin Attack" timing side-channel (potential key recovery).
  # Reaches us only through russh's RSA key support; there is no fixed release.
  # Mitigation: prefer ed25519/ecdsa keys (vterm supports them). Revisit when a
  # patched `rsa` is published.
  "RUSTSEC-2023-0071",

  # ── Unmaintained/unsound, all transitive from Tauri's Linux WebKitGTK stack ──
  # gtk-rs GTK3 bindings (atk/gdk/gtk/...) — unmaintained. Linux-only deps of the
  # Tauri webview backend; not present in the macOS/Windows code paths and not
  # upgradable by us.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",

  # ── quick-xml DoS via malicious XML (fixed in >=0.41.0; not reachable by us) ──
  # Transitive: tauri → plist → quick-xml 0.39.4. `plist` (latest 1.9.0) pins
  # quick-xml to 0.39.x, so there's no upgrade path until Tauri bumps `plist` to a
  # 0.41-based line. Both advisories are denial-of-service via *untrusted* XML input;
  # in vterm `plist` only parses the app's own bundle/config property lists (trusted,
  # developer-controlled), never user-supplied XML at runtime — so not reachable.
  # Revisit when Tauri/plist ships quick-xml >=0.41.0.
  "RUSTSEC-2026-0194", # quadratic run time on duplicate start-tag attributes
  "RUSTSEC-2026-0195", # unbounded namespace-declaration allocation (NsReader)

  # ── Unmaintained transitive build/helper crates ─────────────────────────────
  # proc-macro-error (via transitive macro crates).
  "RUSTSEC-2024-0370",
  # unic-* unicode helpers (via transitive deps).
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[licenses]
version = 2
confidence-threshold = 0.8
# OSI-permissive licenses used across the Tauri/russh dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
