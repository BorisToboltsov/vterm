# cargo-deny policy for vterm — supply-chain gate.
#   cargo deny check            (all)
#   cargo deny check advisories (RUSTSEC)
#
# Every ignored advisory is documented with rationale and must be revisited
# periodically (especially RUSTSEC-2023-0071 once `rsa` ships a fix). An ignore
# that no longer matches anything FAILS the gate (`unused-ignored-advisory`), and
# so does an allowed license nothing uses (`unused-allowed-license`): a stale
# exception would silently re-accept its advisory if a later bump regressed the
# tree into it, under a rationale written for a tree that no longer exists. When
# one goes away — an upstream bump, a withdrawn advisory — delete it.
#
# Triage note: of the ignores below, exactly ONE (RUSTSEC-2023-0071, rsa) is an
# actual vulnerability; the rest are `unmaintained` STATUS advisories, all
# transitive, not crates we depend on directly: Tauri's Linux WebKitGTK backend
# and the zbus 5 helper crates under `keyring` and two Tauri plugins (Linux
# D-Bus). We cannot swap or drop them without dropping Linux, the GUI framework or
# the Secret Service keychain — the realistic fix is an upstream move (exactly how
# the quick-xml and unic-* advisories cleared — see the notes in the block). So the
# standing action for this block is "keep the lockfile, Tauri and keyring current
# (`cargo update`) and re-triage", not "find a replacement crate".

[advisories]
version = 2
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
  # ── Accepted vulnerability (no upstream fix available) ──────────────────────
  # rsa — "Marvin Attack" timing side-channel (potential key recovery).
  # Aliases for the same issue an external SCA scan reports separately:
  # CVE-2023-49092 and GHSA-4grx-2x9w-596c (both == RUSTSEC-2023-0071).
  #
  # Reaches us ONLY through RSA SSH-key support: `russh` (feature `rsa`, part of
  # its default set) and `ssh-key` (feature `rsa`, enabled in Cargo.toml) are the
  # only consumers — `cargo tree -i rsa` shows no others. There is no fixed
  # release (rsa 0.10.0-rc.19 is out, still unpatched per RustSec).
  #
  # Why accepted rather than removed: dropping the `rsa` features would delete the
  # crate entirely but also drop support for RSA host keys and RSA user keys —
  # still common on the legacy servers this tool targets, so a real regression.
  # And the client-side exposure is low: the Marvin oracle needs the attacker to
  # submit ciphertexts and time a PRIVATE-key operation. vterm only VERIFIES host
  # keys (public-key op, no private op) and SIGNS for auth (no attacker-chosen
  # ciphertext oracle) — the practical attack surface a server would need does not
  # exist for a client. Mitigation still stands: prefer ed25519/ecdsa (supported).
  # Revisit when a patched `rsa` ships.
  "RUSTSEC-2023-0071",

  # ── Unmaintained, transitive from Tauri's Linux WebKitGTK stack ─────────────
  # proc-macro-error — pulled by `glib-macros 0.18.5` (`cargo tree -i
  # proc-macro-error --target all`), i.e. the gtk-rs 0.18 (GTK3) bindings under
  # tauri → muda / tao / wry / webkit2gtk. Linux-only and pulled by tauri CORE,
  # so no plugin removal shrinks it. Clears when Tauri's Linux backend moves off
  # gtk-rs 0.18.
  "RUSTSEC-2024-0370",
  # NOTE: the gtk-rs GTK3 "unmaintained" advisories (RUSTSEC-2024-0411…0420) were
  # WITHDRAWN by RustSec on 2026-08-14 and are no longer reported — don't re-add.
  # glib < 0.20.0 `VariantStrIter` unsoundness (RUSTSEC-2024-0429 /
  # GHSA-wrw7-89jp-8q8g) is the same cluster (atk → glib 0.18.5), filed
  # `informational = "unsound"`: cargo-deny keeps it below the deny threshold, so
  # it is documented, not suppressed (an ignore would fail `unused-ignored-
  # advisory`). An external GHSA-based SCA scan does flag it; accepted for the
  # same reason. Our code never calls `VariantStrIter` (we touch glib only through
  # gtk/gdk in winhit.rs), so the unsound path is never exercised. Resolves when
  # Tauri's Linux stack moves to gtk-rs 0.20+.

  # NOTE: the two quick-xml DoS advisories (RUSTSEC-2026-0194/0195) were removed
  # here once `plist 1.10.0` pulled `quick-xml 0.41.0` (the fixed line) — the
  # dependency refresh RESOLVED them rather than suppressing them. Don't re-add a
  # suppression; if they resurface, a dep regressed to quick-xml <0.41.
  # NOTE: likewise the unic-* "unmaintained" advisories (RUSTSEC-2025-0075/0080/
  # 0081/0098/0100) cleared with Tauri 2.12: `tauri-utils 2.10` moved to
  # `urlpattern 0.6`, which no longer depends on unic-*.

  # ── Unmaintained: zbus 5 helper crates (Linux D-Bus) ─────────────────────────
  # zvariant, zbus_names, zvariant_derive — `unmaintained` because upstream
  # merged them INTO zbus 6.0 (as its `wire`/`names` modules and derives); no
  # fix is or will be released for the standalone crates (`patched = []`). It
  # is a status change, not a vulnerability. Root, per `cargo tree --target all
  # -i zvariant`: zbus 5 ← secret-service ← keyring (the Linux Secret Service
  # store) and ← tauri-plugin-opener / tauri-plugin-single-instance. Linux-only.
  # Clears when those move to zbus 6: zbus 6 is stable, but as of 2026-10-28
  # secret-service 5.2 and the plugins' latest 2.x releases are still on zbus 5.
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "deny"
# OSI-permissive licenses used across the Tauri/russh dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  # webpki-root-certs (fallback CA bundle via rustls-platform-verifier, reqwest
  # 0.13's default root source) ships the Mozilla CA set under CDLA-Permissive-2.0
  # — a permissive data license (certificates are data, not code).
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
