<!-- Master source for the app icon. Regenerate the full icon set with:
       pnpm tauri icon src-tauri/icons/icon-source.svg
     then delete the extra android/ios/64x64 outputs (this app ships macOS + Windows + Linux).
     Mark: two cascading terminal windows with a ›_ prompt on the front one (white),
     on the "Deep Well" signature backdrop — a radial gradient with a dark centre and
     lighter rim that reads as depth. The squircle sits inside a ~100px transparent
     safe-area margin (824x824 body on a 1024 canvas) so it matches the size of stock
     macOS dock icons, with a thin macOS-style hairline (light at the top, fading down).
     This is the STATIC bundle icon (Deep Well); in-app the logo re-themes per the
     active theme (see AppLogo.svelte). Keep the two files' mark geometry in sync. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Well: dark centre, lighter rim → dimensional "well". -->
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#04050a"/>
      <stop offset="0.6" stop-color="#0b0f18"/>
      <stop offset="1" stop-color="#1a2233"/>
    </radialGradient>
    <!-- Thin macOS hairline: bright catch along the top, fading toward the bottom. -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>
  </defs>
  <!-- Body (824x824, centred, 100px safe-area margin). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Dark outer rim for crisp definition on light backgrounds. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="9"/>
  <!-- Thin hairline just inside the body. -->
  <rect x="112" y="112" width="800" height="800" rx="176" fill="none" stroke="url(#edge)" stroke-width="10"/>
  <!-- ›_ mark: two cascading windows, front one carries the prompt. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- back window (outline) -->
    <rect x="280" y="330" width="380" height="290" rx="60" stroke="#8f9bb0" stroke-width="34"/>
    <!-- front window (outline) -->
    <rect x="400" y="470" width="400" height="300" rx="60" stroke="#ffffff" stroke-width="40"/>
    <!-- chevron prompt -->
    <path d="M452 548 L527 610 L452 672" stroke="#ffffff" stroke-width="40"/>
    <!-- cursor underscore -->
    <rect x="560" y="632" width="110" height="44" rx="22" fill="#ffffff" stroke="none"/>
  </g>
</svg>
