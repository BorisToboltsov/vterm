[package]
name = "vterm"
version = "1.0.0"
description = "Кроссплатформенный инструмент для работы системных администраторов, devops, sre"
authors = ["Тобольцов Борис Олегович"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Forward a second "Open with vterm" launch to the running window (Phase 12.4).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.61.2"
russh-sftp = "2.3.0"
tokio = { version = "1.52.3", features = ["full"] }
# Proxy transports for reaching a server (Phase 21): SOCKS5 via tokio-socks and
# HTTP CONNECT via async-http-proxy. Both hand back a plain byte stream that
# russh's `connect_stream` runs the SSH session over — same shape as the jump
# host's `direct-tcpip` channel. (SSH jump host needs no extra crate.)
tokio-socks = "0.5.2"
async-http-proxy = { version = "1.2.5", features = ["runtime-tokio", "basic-auth"] }
directories = "6.0.0"
tauri-plugin-dialog = "2.7.1"
# keyring 4.x reorganised features: the 3.x `apple-native`/`windows-native` flags
# are gone; the default `v1` feature bundles the native stores (macOS Keychain,
# Windows Credential Manager). API (Entry/Error/get_set/delete_credential) unchanged.
keyring = "4"
thiserror = "2"
zeroize = "1"
# SHA-256 for the config editor: conflict detection (compare on-server hash vs the
# hash the editor opened) and directory sync (Phase 12.5). RustCrypto, no C deps.
sha2 = "0.11"
# Base64 for the markdown preview's inline images (Phase 44.4): image bytes cross
# to the WebView as a `data:` URL. Encoding here rather than shipping a `Vec<u8>`
# is not a micro-optimisation — Tauri serialises a byte vector as a JSON array of
# numbers, which is roughly 4x the payload for a screenshot-sized PNG.
base64 = "0.22"
portable-pty = "0.9.0"
# Backups are shipped as a portable .zip archive (manifest + data); deflate-only
# keeps the dependency tree small (flate2/crc32fast are already in the tree).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# AI broker (Phase 17, opt-in): all LLM HTTP lives in the backend so the WebView
# CSP stays strict. TLS is rustls (never native-tls/OpenSSL) so the build stays
# portable. reqwest 0.13 renamed `rustls-tls`→`rustls` and dropped the public ring
# feature; `rustls` now uses the aws-lc-rs provider — the same one russh already
# pulls in, so this shares a single crypto provider instead of also compiling ring.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"

# SSH key-pair generation utility (Phase 32): local, offline OpenSSH keygen via
# the same `ssh-key` crate russh already pulls in (re-exported as
# `russh::keys::ssh_key`), pinned to the exact lock version so Cargo unifies to a
# single copy. `rand` supplies the CSPRNG — `ThreadRng` is a rand_core 0.10
# `CryptoRng`, which `PrivateKey::random`/`encrypt` require. No network, no
# shelling out to ssh-keygen; the offline invariant is untouched.
ssh-key = { version = "=0.7.0-rc.10", features = ["ed25519", "rsa", "encryption", "p256", "std"] }
rand = "0.10"

# Native, cross-OS local system metrics for the status bar / monitoring overlay on
# LOCAL shell tabs (Phase 38). Servers report metrics via a `/proc` shell probe over
# SSH; local tabs have no such session and `/proc` doesn't exist on macOS/Windows, so
# we read CPU/RAM/swap/disk/net/processes/temperatures through `sysinfo`. Pure local
# syscalls — no network — so the offline invariant stays intact. Default features
# (system/disk/network/component/user) are exactly what the collector needs.
sysinfo = "0.39"

# Text-encoding support for the config editor (Phase 39). Windows config files are
# routinely UTF-16LE (PowerShell redirects, many .ini) or a legacy ANSI codepage
# (CP1251 on a Russian install), and the editor used to reject both: UTF-16's NUL
# bytes tripped the "looks binary" check, and ANSI failed strict from_utf8. We now
# decode on open and re-encode in the SAME encoding on save, so vterm never
# silently rewrites a file into UTF-8 behind other tools' backs.
#   encoding_rs — the WHATWG decoders/encoders (Firefox's; no C deps).
#   chardetng   — Firefox's legacy-encoding detector, for BOM-less non-UTF-8.
# Both are pure Rust and offline; the offline invariant is untouched.
encoding_rs = "0.8"
chardetng = "1"

# Read the OS clipboard in-process so the frontend can avoid
# navigator.clipboard.readText() and WebKit's "Paste" permission prompt.
# Already in the tree transitively via Tauri; pinned here to use it directly.
# Windows drive enumeration for the local file panel (Фаза 39.1). `GetLogicalDrives`
# returns the letter bitmask WITHOUT touching any volume — the only complete source
# that cannot block on a stale network mount (see drives.rs for the alternatives
# considered). Already in the tree transitively, so this unifies to one copy.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"

