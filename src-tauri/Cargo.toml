[package]
name = "vterm"
version = "0.13.17"
description = "Кроссплатформенный инструмент для работы системных администраторов, devops, sre"
authors = ["Тобольцов Борис Олегович"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Forward a second "Open with vterm" launch to the running window (Phase 12.4).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.61.2"
russh-sftp = "2.3.0"
tokio = { version = "1.52.3", features = ["full"] }
directories = "6.0.0"
tauri-plugin-dialog = "2.7.1"
keyring = { version = "^3", features = ["apple-native", "windows-native"] }
thiserror = "2"
zeroize = "1"
# SHA-256 for the config editor: conflict detection (compare on-server hash vs the
# hash the editor opened) and directory sync (Phase 12.5). RustCrypto, no C deps.
sha2 = "0.10"
portable-pty = "0.9.0"
# Backups are shipped as a portable .zip archive (manifest + data); deflate-only
# keeps the dependency tree small (flate2/crc32fast are already in the tree).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Read the OS clipboard in-process so the frontend can avoid
# navigator.clipboard.readText() and WebKit's "Paste" permission prompt.
# Already in the tree transitively via Tauri; pinned here to use it directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"

